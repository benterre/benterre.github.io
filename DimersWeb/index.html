<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Brane Tiling Editor</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [["\\(", "\\)"]] },
            svg: { fontCache: "global" },
            startup: { typeset: false }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <style>
        html, body {
            margin: 0;
            font-family: sans-serif;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            overflow: hidden;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(30, 30, 30, 0.9);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        #ui h3 {
            text-align: center;
            margin: 4px 0;
            color: #eee;
        }

        #qw {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(30, 30, 30, 0.9);
            border-radius: 6px;
            padding: 10px;
            display: none;
            flex-direction: column;
            z-index: 10;
            width: 290px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            color: #eee;
        }

        #qw h3 {
            text-align: center;
            margin: 4px 0 8px;
        }

        #qwTitle {
            font-size: 15px;
            line-height: 1.4;
            overflow-wrap: break-word;
        }

        /* MathJax inline SVGs must escape the global `svg` sizing rule */
        #qw mjx-container svg {
            width: auto;
            height: auto;
            flex: none;
            background: transparent;
            vertical-align: middle;
        }

        .qw-pre.qw-math {
            color: #fff;
            font-family: serif;
            font-size: 13px;
            line-height: 1.7;
            min-height: 22px;
        }

        #quiverBox {
            background: #111;
            border-radius: 4px;
        }

        #quiverSvg {
            display: block;
            width: 100%;
            height: 190px;
            flex: none;
            background: transparent;
        }

        .qw-section {
            margin-bottom: 12px;
        }

        .qw-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
            margin: 4px 0;
            color: #eee;
        }

        .copy-btn {
            width: auto;
            margin: 0;
            padding: 2px 9px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .copy-btn:hover {
            background: #666;
        }

        .qw-pre {
            background: #111;
            color: #9f9;
            font-family: monospace;
            font-size: 11px;
            line-height: 1.5;
            padding: 6px;
            margin: 0;
            border-radius: 4px;
            overflow: auto;
            max-height: 150px;
            white-space: pre;
        }

        .qw-note {
            color: #aaa;
            font-size: 11px;
            margin: 3px 0 0;
        }

        #toricBox {
            background: #fafafa;
            border: 2px solid #555;
            border-radius: 4px;
        }

        #toricBox.inconsistent {
            border-color: #e74c3c;
            box-shadow: 0 0 8px rgba(231, 76, 60, 0.8);
        }

        #toricSvg {
            display: block;
            width: 100%;
            height: 200px;
            flex: none;
        }

        button {
            width: 100%;
            margin: 4px 0;
            padding: 6px;
            cursor: pointer;
        }

        svg {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #fafafa;
        }

        .quad-hover {
            fill: rgba(255, 200, 0, 0.35);
            stroke: #f39c12;
            stroke-width: 2;
        }

        .fd-arrow {
            stroke: rgb(232, 77, 5);
            stroke-width: 2.5;
            fill: none;
            pointer-events: none;
        }

        .fd-tip {
            fill: rgb(232, 77, 5);
            stroke: #fff;
            stroke-width: 1.5;
            cursor: move;
        }

        .fd-origin {
            fill: #fff;
            stroke: rgb(232, 77, 5);
            stroke-width: 2;
            pointer-events: none;
        }

        .fd-region {
            fill: rgba(232, 77, 5, 0.10);
            stroke: rgb(232, 77, 5);
            stroke-width: 1;
            stroke-dasharray: 5 4;
            pointer-events: none;
        }

        .tile-button {
            width: 90px;
            height: 90px;
            margin: 6px auto;
            background: #333;
            border: 4px solid #444;
            cursor: pointer;
        }

        .tile-button.selected {
            border-color: rgb(232, 77, 5);
        }

        #zoomControls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(30, 30, 30, 0.9);
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        #zoomControls button {
            background: #444;
            color: white;
            border: none;
            margin: 2px 0;
            width: 36px;
            height: 36px;
            font-size: 18px;
            cursor: pointer;
        }

        #zoomControls button:hover {
            background: #666;
        }

        /* "Open in Database" float — shown only when the current toric
           diagram matches a theory in the BraneTilingDatabase */
        #dbLink {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(30, 30, 30, 0.9);
            border-radius: 6px;
            padding: 10px 12px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
            color: #eee;
            max-width: 300px;
        }

        #dbLink .db-head {
            font-size: 11px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #9aa;
        }

        #dbLinkName {
            font-size: 15px;
            line-height: 1.4;
            overflow-wrap: break-word;
        }

        #dbLink mjx-container svg {
            width: auto;
            height: auto;
            flex: none;
            background: transparent;
            vertical-align: middle;
        }

        #dbLinkBtn {
            background: rgb(232, 77, 5);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 7px 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        #dbLinkBtn:hover {
            background: rgb(255, 100, 25);
        }
    </style>
</head>

<body>
    <div id="ui">
        <h3>Tiles</h3>
        <div id="tilePalette"></div>
    </div>

    <svg id="svg"></svg>

    <div id="qw">
        <h3 id="qwTitle">Dimer model</h3>
        <div class="qw-section">
            <div class="qw-head"><span>Kasteleyn matrix</span><button class="copy-btn" data-copy="kasteleyn"
                    title="Copy to clipboard">⧉</button></div>
            <div id="kasteleyn" class="qw-pre qw-math"></div>
            <p id="kasteleynNote" class="qw-note"></p>
        </div>
        <div class="qw-section">
            <div class="qw-head"><span>Quiver</span><button class="copy-btn" data-copy="quiver"
                    title="Copy to clipboard">⧉</button></div>
            <div id="quiverBox"><svg id="quiverSvg"></svg></div>
            <p id="quiverNote" class="qw-note"></p>
        </div>
        <div class="qw-section">
            <div class="qw-head"><span>Superpotential</span><button class="copy-btn" data-copy="superpotential"
                    title="Copy to clipboard">⧉</button></div>
            <div id="superpotential" class="qw-pre qw-math"></div>
        </div>
        <div class="qw-section">
            <div class="qw-head"><span>Toric diagram</span><button class="copy-btn" data-copy="toric"
                    title="Copy to clipboard">⧉</button></div>
            <div id="toricBox"><svg id="toricSvg"></svg></div>
            <p id="toricNote" class="qw-note"></p>
        </div>
    </div>

    <div id="zoomControls">
        <button id="toggleNodesBtn" title="Toggle B/W vertices">◐</button>
        <button id="toggleFaceIdsBtn" title="Toggle face ID labels">🏷</button>
        <button id="zoomIn">＋</button>
        <button id="zoomOut">−</button>
        <button id="zoomHome">⌂</button>
    </div>

    <div id="dbLink">
        <span class="db-head">Found in database</span>
        <span id="dbLinkName"></span>
        <button id="dbLinkBtn">Open in Database ↗</button>
    </div>

    <!-- BraneTilingDatabase search index (window.DIMER_DB_INDEX); optional -->
    <!-- <script src="/BraneTilingDatabase/db/index.js"></script> -->
    <script src="main.js"></script>
</body>

</html>
